name: HRT sidebar version correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hrt-version-label-hotfix.yml']
permissions:
  contents: write
jobs:
  fix-version-label:
    if: github.repository == 'viktormorozow-a11y/vm-private-capital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify and correct only the stale sidebar label
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.request
          from pathlib import Path

          endpoint = 'https://api.github.com/repos/viktormorozow-a11y/vm-private-capital/contents/hrt/index.html'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'hrt-version-label-check'}
          def request(url, data=None):
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=None if data is None else json.dumps(data).encode(), headers=headers, method='GET' if data is None else 'PUT')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          current = request(endpoint + '?ref=main')
          source_bytes = base64.b64decode(current['content'])
          source = source_bytes.decode('utf-8')
          match = re.search(r"const APP_VERSION='([0-9]+\.[0-9]+\.[0-9]+)';", source)
          assert match and match.group(1) == '3.8.2', 'Unexpected application version; no change made'
          old = '>Версия 3.8.0</small>'
          new = '>Версия 3.8.2</small>'
          if old not in source:
              assert source.count(new) == 1, 'Unexpected sidebar; no change made'
              print('Sidebar is already correct. No write performed.')
              raise SystemExit(0)
          assert current['sha'] == 'ebfc2ec1aeac0d2a08d7dd3e4c9d7fdbd09fd447', 'Source changed since review; no change made'
          assert source.count(old) == 1, 'Expected exactly one stale sidebar label'
          print('Regression reproduced: sidebar 3.8.0 differs from APP_VERSION 3.8.2')
          fixed = source.replace(old, new, 1)
          assert fixed.replace(new, old, 1) == source
          assert len(fixed) == len(source)
          assert fixed.count(new) == 1
          assert '<title>HRT Health Studio v3.8.2' in fixed
          assert 'HRT Health Studio · v3.8.2</div>' in fixed
          assert '>v3.8.2</span>' in fixed
          pattern = r'<script\b[^>]*>([\s\S]*?)</script>'
          scripts_before = re.findall(pattern, source)
          scripts_after = re.findall(pattern, fixed)
          assert scripts_after == scripts_before, 'JavaScript changed unexpectedly'
          with tempfile.TemporaryDirectory() as folder:
              for index, script in enumerate(scripts_after):
                  if script.strip():
                      path = Path(folder) / ('script-' + str(index) + '.js')
                      path.write_text(script, encoding='utf-8')
                      subprocess.run(['node', '--check', str(path)], check=True)
          result = request(endpoint, {'message': 'Fix HRT sidebar version label: 3.8.0 to 3.8.2', 'content': base64.b64encode(fixed.encode('utf-8')).decode(), 'sha': current['sha'], 'branch': 'main'})
          verified = request(endpoint + '?ref=' + result['commit']['sha'])
          assert base64.b64decode(verified['content']) == fixed.encode('utf-8')
          print('Verified commit: ' + result['commit']['sha'])
          print('PASS: sidebar, page title, login version and version badge agree; application scripts are byte-for-byte unchanged.')
          PY
