name: HRT sync recovery and table layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hrt-sync-recovery-hotfix.yml']
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    if: github.repository == 'viktormorozow-a11y/vm-private-capital' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact reviewed patch and verify JavaScript syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, tempfile, urllib.request
          from pathlib import Path
          endpoint='https://api.github.com/repos/viktormorozow-a11y/vm-private-capital/contents/hrt/index.html'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'hrt-reviewed-repair'}
          def api(url,data=None):
            request=urllib.request.Request(url,data=None if data is None else json.dumps(data).encode(),headers=headers,method='GET' if data is None else 'PUT')
            with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          current=api(endpoint+'?ref=main')
          assert current['sha']=='f68e2b2de7d9d0621789b62388654938dc2b620c','Source changed; no write performed'
          original=base64.b64decode(current['content']).decode('utf-8')
          s=original.replace('3.8.4','3.8.5')
          def replace(a,b,count=1):
            global s
            assert s.count(a)==count, 'Unexpected source anchor: '+a[:70]
            s=s.replace(a,b)
          css='''
          /* Protocol comments must wrap inside their own column. */
          #protocolList table{table-layout:fixed;min-width:820px}
          #protocolList th:nth-child(1){width:90px}
          #protocolList th:nth-child(2){width:195px}
          #protocolList th:nth-child(3){width:200px}
          #protocolList th:nth-child(5){width:192px}
          #protocolList td{white-space:normal;overflow-wrap:anywhere;vertical-align:top;max-width:none}
          #protocolList td:nth-child(4){line-height:1.55}
          #protocolList td:last-child .actions{justify-content:flex-start;align-items:flex-start;flex-wrap:wrap}
          .hrt-recovery-notice{padding:12px 16px;margin-bottom:14px;border:1px solid var(--gold);border-radius:12px;line-height:1.5;font-size:12px}
          .hrt-recovery-notice .btn{margin-top:8px}
          '''
          replace('</style>',css+'\n</style>')
          replace("const snapshot=JSON.stringify(payload);\n    const stamp=new Date().toISOString();", "const snapshot=JSON.stringify(payload);\n    if(hrtCloudVersion)payload._cloudBaseUpdatedAt=hrtCloudVersion;\n    const stamp=new Date().toISOString();")
          replace("if(code==='23505')hrtCloudConflictNotice('Запись уже создана в облаке на другом устройстве.');", "if(code==='PT409')hrtCloudConflictNotice('Сервер отклонил устаревшую запись. Обновите страницу: новая облачная копия будет загружена после резервного сохранения локальной.');\n    else if(code==='23505')hrtCloudConflictNotice('Запись уже создана в облаке на другом устройстве.');")
          helpers='''function hrtRecoveryKey(){return 'hrt_recovery_v1:'+String(hrtCloudUser?.id||'unassigned')}
          function backupHrtLocalForRecovery(reason){
            const key=hrtRecoveryKey(),raw=localStorage.getItem(key);
            const previous=raw?JSON.parse(raw):[];
            if(!Array.isArray(previous))throw new Error('Повреждён список резервных копий; автоматическая замена отменена.');
            const payload=JSON.parse(JSON.stringify(state));
            if(previous.some(x=>JSON.stringify(x.payload)===JSON.stringify(payload)))return;
            const entry={capturedAt:new Date().toISOString(),reason,cloudUserId:hrtCloudUser?.id||null,payload};
            const encoded=JSON.stringify([...previous,entry]);
            localStorage.setItem(key,encoded);
            if(localStorage.getItem(key)!==encoded)throw new Error('Не удалось проверить резервную копию. Локальные данные не заменены.');
          }
          function showHrtRecoveryNotice(){
            const main=document.querySelector('main');if(!main||!localStorage.getItem(hrtRecoveryKey()))return;
            let box=document.getElementById('hrtRecoveryNotice');
            if(!box){box=document.createElement('div');box.id='hrtRecoveryNotice';box.className='hrt-recovery-notice';main.prepend(box);}
            box.innerHTML='<b>Загружена актуальная облачная копия.</b><br>Предыдущие локальные данные сохранены отдельно, без перезаписи облака. Их можно скачать для сверки.<br><button class="btn" type="button" onclick="exportHrtRecovery()">Скачать сохранённые локальные данные</button>';
          }
          function exportHrtRecovery(){
            const raw=localStorage.getItem(hrtRecoveryKey());if(!raw)return;
            const blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
            link.href=url;link.download='HRT_local_recovery_'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
          }
          '''
          start=s.index('async function loadHrtCloudState(');end=s.index('\nfunction applyHrtSuiteAccess(',start)
          load='''async function loadHrtCloudState({force=false,showToast=false,recover=false}={}){
            if(!hrtSupabase||!hrtCloudUser||hrtCloudBusy)return false;
            const wasDirty=localStorage.getItem(HRT_CLOUD_DIRTY_KEY)==='1';
            if(wasDirty&&!force&&!recover){hrtCloudConflictNotice('Есть локальные изменения. Нажмите «Загрузить» для безопасной загрузки с резервной копией.');return false;}
            if(wasDirty&&force&&!recover&&!confirm('Локальные изменения будут сохранены в отдельную резервную копию, затем загрузятся актуальные облачные данные. Продолжить?'))return false;
            const before=JSON.stringify(state),userId=hrtCloudUser.id;
            hrtCloudBusy=true;hrtCloudSetStatus('busy','Загружаю из облака…',hrtCloudUser.email||'');
            try{
              const {data,error}=await hrtSupabase.from('hrt_user_data').select('payload,updated_at').eq('user_id',userId).maybeSingle();
              if(error)throw error;
              if(hrtCloudUser?.id!==userId)return false;
              if(!data){
                hrtCloudVersion=null;hrtCloudConflict=false;
                if(hrtCloudHasMeaningfulData(state)){hrtCloudBusy=false;return await saveHrtCloudState(showToast)}
                hrtCloudSetStatus('ok','Облако подключено','Пока нет данных HRT');return true;
              }
              const editedDuringLoad=JSON.stringify(state)!==before;
              if(editedDuringLoad&&!recover){hrtCloudConflictNotice('Во время загрузки появились новые локальные изменения; они не заменены.');return false;}
              if(wasDirty||editedDuringLoad||localStorage.getItem(HRT_CLOUD_DIRTY_KEY)==='1')backupHrtLocalForRecovery('before_loading_newer_cloud');
              const incoming=migrateHrtState(JSON.parse(JSON.stringify(data.payload||{})));
              // Persist first: if storage is full, the currently displayed state is left unchanged.
              localStorage.setItem(KEY,JSON.stringify(incoming));
              state=incoming;hrtSuppressCloudSave=true;
              localStorage.setItem(HRT_LOCAL_UPDATED_KEY,new Date().toISOString());
              localStorage.removeItem(HRT_CLOUD_DIRTY_KEY);
              const stamp=data.updated_at;hrtCloudVersion=stamp;hrtCloudConflict=false;
              localStorage.setItem(HRT_CLOUD_LAST_SYNC_KEY,stamp);
              hrtSuppressCloudSave=false;renderAll();showHrtRecoveryNotice();
              hrtCloudSetStatus('ok','Облако синхронизировано',`${hrtCloudUser.email||''} · ${new Date(stamp).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`);
              if(showToast)hrtCloudToast('Актуальные HRT данные загружены');
              return true;
            }catch(e){
              hrtSuppressCloudSave=false;console.error('HRT cloud load error',e);
              hrtCloudSetStatus('err','Загрузка не выполнена',e?.message||'Локальная копия сохранена');
              if(showToast)hrtCloudToast('Не удалось загрузить облачные данные');return false;
            }finally{hrtCloudBusy=false}
          }
          '''
          s=s[:start]+helpers+load+s[end:]
          replace("hrtCloudConflictNotice('После последней синхронизации облачная запись изменилась. Ни одна копия не удалена.');\n        return {redirected:false,conflict:true};", "return await loadHrtCloudState({recover:true,showToast:false});")
          lines=s.splitlines()
          for i,line in enumerate(lines):
            if "$('protocolList').innerHTML=" in line:
              lines[i]=line.replace('${fmtDate(p.start)}','${protocolStartText(p)}').replace("${p.comment||'—'}","${safeHtml(p.comment||'—')}")
          s='\n'.join(lines)+('\n' if s.endswith('\n') else '')
          body=s.encode('utf-8')
          digest=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()
          assert digest=='cb97e02629e76ac8f0a44db040a7ca8a135859c3','Patch differs from browser-tested file; no write performed'
          with tempfile.TemporaryDirectory() as directory:
            for i,script in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s)):
              if script.strip():
                path=Path(directory)/('script-'+str(i)+'.js');path.write_text(script)
                subprocess.run(['node','--check',str(path)],check=True)
          result=api(endpoint,{'message':'HRT 3.8.5: preserve local recovery snapshots, send server base version, wrap protocol comments','sha':current['sha'],'branch':'main','content':base64.b64encode(body).decode()})
          verified=api(endpoint+'?ref='+result['commit']['sha'])
          assert base64.b64decode(verified['content'])==body
          print('Verified commit:',result['commit']['sha'])
          print('Verified content SHA:',digest)
          print('PASS: committed bytes exactly match the browser-tested file. No database operations performed.')
          PY
